<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Store</title>
    <link rel="stylesheet" href="new.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Radios Electronics Store</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Electronic Store HTML Template</h1>
            <p>06+ Stunning Home Page Demos</p>
        </div>
    </section>

    <section class="product-categories">
        <div class="container">
            <h2>Product Categories</h2>
            <div class="category-grid">
                <div class="category">
                    <img src="camera.jpg" alt="Camera">
                    <h3>Digital SLR Camera</h3>
                    <p>High Definition</p>
                </div>
                <div class="category">
                    <img src="watch.jpg" alt="Watch">
                    <h3>Waterma Watch</h3>
                    <p>Beats Studio</p>
                </div>
                <div class="category">
                    <img src="security.jpg" alt="Security Camera">
                    <h3>Security Camera</h3>
                    <p>180020/10000</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 Radios Electronics Store</p>
    </footer>

</body>
</html>
